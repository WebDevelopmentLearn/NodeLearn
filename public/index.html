<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework 15</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./index.js" type="module"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="chatWindow">
        <h1>Online chat</h1>
        <h2 class="roomHeader">Room id: <span id="roomId"></span></h2>
        <div class="chatOutput"></div>
        <div class="chatInputPanel">
            <div class="joinRoomPanel">
                <input class="joinRoomInput" type="number" placeholder="room id">
                <button class="joinRoomButton">Join</button>
            </div>
            <div class="chatMessageInputAndBtnPanel">
                <input type="text" class="chatInput">
                <button class="chatButton">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
